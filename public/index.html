<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BIG Partner Portal</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#07111F;color:white;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px;text-align:center}
.container{max-width:900px}
h1{font-size:64px;margin-bottom:20px}
p{font-size:20px;line-height:1.7;color:#cbd5e1}
.badge{display:inline-block;padding:10px 18px;border-radius:999px;background:#0ea5e9;color:#07111F;font-weight:bold;margin-bottom:20px}
.buttons{margin-top:40px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.btn{padding:14px 24px;border-radius:999px;text-decoration:none;font-weight:bold}
.primary{background:#38bdf8;color:#07111F}
.secondary{border:1px solid rgba(255,255,255,.2);color:white}
</style>
</head>
<body>
<div class="container">
<div class="badge">Brokerage Interconnect Group</div>
<h1>BIG Partner Portal</h1>
<p>The white-label distribution engine for telecom revenue.</p>
<p>B.I.G. is building a modern telecom distribution platform for sub-agents, MSPs, IT consultants, carriers, and enterprise connectivity buyers.</p>
<div class="buttons">
<a class="btn primary" href="#">Become a Partner</a>
<a class="btn secondary" href="#">Portal Preview</a>
</div>
</div>
</body>
</html>
